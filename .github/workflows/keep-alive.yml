name: Keep Render API awake

# Render's free tier sleeps the API after 15 idle minutes, and the first user
# after that waits ~30-60s for it to boot. Pinging the health endpoint every
# 10 minutes keeps it awake. One always-on free service uses ~744 of the 750
# free instance-hours Render gives per month, so this stays within the free tier.
#
# Note: GitHub may delay scheduled runs by a few minutes under load, and it
# disables schedules after 60 days without repository activity. The client
# also retries automatically while the server wakes (client/src/lib/apiClient.js),
# so a missed ping only costs a short wait, never an error.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          curl --silent --show-error --fail --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 90 https://smaatech-hrms-1.onrender.com/api/v1/health
