name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Run Client Linting
        run: npm --prefix client run lint

      - name: Run Client Build Verification
        run: npm --prefix client run build

      - name: Run Server Test Suite
        run: npm --prefix server run test

      - name: Run Client Test Suite
        run: npm --prefix client run test

      # Boots the REAL server process against a throwaway replica set and
      # drives it over HTTP. The vitest suite uses supertest in-process, which
      # never proves that `npm start` itself works — that startup config checks
      # pass, indexes build, schedulers register once, and the port serves.
      - name: Run Runtime Smoke Test
        run: npm --prefix server run smoke

      # Production dependencies only: a HIGH/CRITICAL advisory in something
      # that ships is a release blocker, whereas one in a dev-only tool is not.
      - name: Audit Production Dependencies
        run: npm --prefix server audit --omit=dev --audit-level=high
